name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
    build:
      runs-on: ubuntu-latest
      steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Initialize Buildozer Spec
        run: |
          pip install buildozer
          buildozer init

      - name: Configure buildozer.spec
        run: |
          python3 -c '
          import re

          with open("buildozer.spec", "r") as f:
              content = f.read()

          settings = {
              "android.api": "33",
              "android.minapi": "21",
              "android.build_tools_version": "33.0.2",
              "android.permissions": "RECEIVE_BOOT_COMPLETED, WAKE_LOCK",
              "requirements": "python3,kivy,jnius",
              "title": "Study Lockdown",
              "package.name": "studytracker"
          }

          for key in settings:
              content = re.sub(rf"^[#\s]*{re.escape(key)}\s*=.*$", "", content, flags=re.MULTILINE)

          replacement = "[app]\n"
          for key, val in settings.items():
              replacement += f"{key} = {val}\n"

          content = content.replace("[app]", replacement, 1)

          with open("buildozer.spec", "w") as f:
              f.write(content)
          '

      - name: Build with Buildozer Action
        uses: kivy/buildozer-action@main
        with:
          command: buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: study-lockdown-apk
          path: bin/*.apk
