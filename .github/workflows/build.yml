name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev lld

    - name: Install Buildozer
      run: |
        pip install --upgrade pip
        pip install buildozer cython==0.29.36

    - name: Initialize Buildozer Spec
      run: |
        buildozer init

    - name: Update buildozer.spec
      run: |
        sed -i 's/#android.permissions =.*/android.permissions = RECEIVE_BOOT_COMPLETED, WAKE_LOCK/' buildozer.spec
        sed -i 's/requirements = python3,kivy/requirements = python3,kivy,jnius/' buildozer.spec
        sed -i 's/title = My Application/title = Study Lockdown/' buildozer.spec
        sed -i 's/package.name = myapp/package.name = studytracker/' buildozer.spec

    - name: Build with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: study-lockdown-apk
        path: bin/*.apk
