name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev lld

    - name: Install Buildozer
      run: |
        pip install --upgrade pip
        pip install buildozer cython==0.29.36

    - name: Initialize Buildozer Spec
      run: |
        buildozer init

    - name: Configure buildozer.spec
      run: |
        python3 -c '
        import re
        with open("buildozer.spec", "r") as f:
            text = f.read()

        def set_val(key, val, text):
            pattern = re.compile(r"^[#\s]*" + key + r"\s*=.*$", re.MULTILINE)
            if pattern.search(text):
                return pattern.sub(f"{key} = {val}", text)
            else:
                return text + f"\n{key} = {val}\n"

        text = set_val("android.api", "33", text)
        text = set_val("android.minapi", "21", text)
        text = set_val("android.build_tools_version", "33.0.2", text)
        text = set_val("android.permissions", "RECEIVE_BOOT_COMPLETED, WAKE_LOCK", text)
        text = set_val("requirements", "python3,kivy,jnius", text)
        text = set_val("title", "Study Lockdown", text)
        text = set_val("package.name", "studytracker", text)

        with open("buildozer.spec", "w") as f:
            f.write(text)
        '

    - name: Build with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: study-lockdown-apk
        path: bin/*.apk
